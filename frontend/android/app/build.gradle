// ==============================================================================
// Proyecto: BA Protege+
// Componente: Configuración Gradle App
// Archivo: android/app/build.gradle
// Descripción: Configuración de compilación, dependencias de Android y React Native
// ==============================================================================

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    /* Folders */
    //   root = "../../"
    //   reactNativeDir = "../../node_modules/react-native"
    //   codegenDir = "../../node_modules/@react-native/codegen"
    //   cliPath = "../../node_modules/react-native/cli.js"
}

def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.baprotege"

    defaultConfig {
        applicationId "com.baprotege"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // React Native Core
    implementation("com.facebook.react:react-android")
    
    // React Native Engine (JSC por padrão no RN < 0.70 ou quando Hermes desabilitado)
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation project(':react-native-async-storage_async-storage')
    implementation project(':react-native-community_datetimepicker')
    implementation project(':react-native-firebase_app')
    implementation project(':react-native-firebase_messaging')
    implementation project(':react-native-google-signin_google-signin')
    
    // Kotlin Standard Library
    implementation("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}")
    
    // AndroidX & Componentes de UI
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.appcompat:appcompat:1.7.0")
}

apply plugin: "com.google.gms.google-services"

// ==============================================================================
// Automatización: Copia de APK debug a la landing (ba-protege-release.apk)
// ==============================================================================
tasks.register('copyDebugApkToLanding') {
    description = "Copia el APK debug compilado hacia frontend/landing/assets/apk como ba-protege-release.apk"
    group = "ba-protege"

    doLast {
        def originFile = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        def targetDir = file("${projectDir}/../../landing/assets/apk")
        def targetFile = file("${targetDir}/ba-protege-release.apk")

        if (originFile.exists()) {
            targetDir.mkdirs()
            java.nio.file.Files.copy(
                originFile.toPath(),
                targetFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            def sizeMb = String.format(java.util.Locale.US, "%.2f", (double) originFile.length() / (1024 * 1024))
            println("🚀 [BA Protege+] APK copiada exitosamente (${sizeMb} MB) a:")
            println("   ${targetFile.absolutePath}")
        } else {
            println("⚠️ [BA Protege+] APK de origen no encontrada en: ${originFile.absolutePath}")
        }
    }
}

// ==============================================================================
// Automatización: Sincronización del video de apertura hacia res/raw
// ==============================================================================
tasks.register('syncSplashVideoAsset') {
    description = "Sincroniza frontend/src/assets/videos/hola_botito.mp4 hacia android/app/src/main/res/raw/hola_botito.mp4"
    group = "ba-protege"

    doLast {
        def sourceVideo = file("${projectDir}/../../src/assets/videos/hola_botito.mp4")
        def targetRawDir = file("${projectDir}/src/main/res/raw")
        def targetVideo = file("${targetRawDir}/hola_botito.mp4")

        if (sourceVideo.exists()) {
            targetRawDir.mkdirs()
            if (!targetVideo.exists() ||
                sourceVideo.length() != targetVideo.length() ||
                sourceVideo.lastModified() > targetVideo.lastModified()) {
                java.nio.file.Files.copy(
                    sourceVideo.toPath(),
                    targetVideo.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn('syncSplashVideoAsset')
}

tasks.configureEach { task ->
    if (task.name == "assembleDebug" || task.name == "packageDebug") {
        task.finalizedBy('copyDebugApkToLanding')
    }
}

