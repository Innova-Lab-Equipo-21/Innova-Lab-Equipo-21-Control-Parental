// ==============================================================================
// Proyecto: BA Protege+
// Componente: Configuración Gradle App
// Archivo: android/app/build.gradle
// Descripción: Configuración de compilación, dependencias de Android y React Native
// ==============================================================================

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    /* Folders */
    //   root = "../../"
    //   reactNativeDir = "../../node_modules/react-native"
    //   codegenDir = "../../node_modules/@react-native/codegen"
    //   cliPath = "../../node_modules/react-native/cli.js"
}

def jscFlavor = 'org.webkit:android-jsc:+'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new java.util.Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.baprotege"

    defaultConfig {
        applicationId "com.baprotege"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            // Usa o debug.keystore padrão do Android SDK (~/.android/debug.keystore)
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // React Native Core
    implementation("com.facebook.react:react-android")
    
    // React Native Engine (JSC por padrão no RN < 0.70 ou quando Hermes desabilitado)
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation project(':react-native-async-storage_async-storage')
    implementation project(':react-native-community_datetimepicker')
    implementation project(':react-native-firebase_app')
    implementation project(':react-native-firebase_messaging')
    implementation project(':react-native-google-signin_google-signin')
    
    // Kotlin Standard Library
    implementation("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}")
    
    // AndroidX & Componentes de UI
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.appcompat:appcompat:1.7.0")

    // CameraX & ML Kit Barcode Scanning (Lector QR nativo para vinculación)
    def cameraxVersion = "1.4.2"
    implementation("androidx.camera:camera-core:${cameraxVersion}")
    implementation("androidx.camera:camera-camera2:${cameraxVersion}")
    implementation("androidx.camera:camera-lifecycle:${cameraxVersion}")
    implementation("androidx.camera:camera-view:${cameraxVersion}")
    implementation("androidx.camera:camera-mlkit-vision:${cameraxVersion}")
    implementation("com.google.mlkit:barcode-scanning:17.3.0")
}

apply plugin: "com.google.gms.google-services"

// ==============================================================================
// Automatización: Copia de APK debug a la landing (ba-protege-release.apk)
// ==============================================================================
tasks.register('copyDebugApkToLanding') {
    description = "Copia el APK debug compilado hacia frontend/landing/assets/apk como ba-protege-release.apk"
    group = "ba-protege"

    doLast {
        def originFile = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        def targetDir = file("${projectDir}/../../landing/assets/apk")
        def targetFile = file("${targetDir}/ba-protege-release.apk")

        if (originFile.exists()) {
            targetDir.mkdirs()
            java.nio.file.Files.copy(
                originFile.toPath(),
                targetFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            def sizeMb = String.format(java.util.Locale.US, "%.2f", (double) originFile.length() / (1024 * 1024))
            println("🚀 [BA Protege+] APK debug copiada exitosamente (${sizeMb} MB) a:")
            println("   ${targetFile.absolutePath}")
        } else {
            println("⚠️ [BA Protege+] APK de origen no encontrada en: ${originFile.absolutePath}")
        }
    }
}

// ==============================================================================
// Automatización: Copia de APK release firmada a la landing (ba-protege-release.apk)
// ==============================================================================
tasks.register('copyReleaseApkToLanding') {
    description = "Copia el APK release firmado hacia frontend/landing/assets/apk como ba-protege-release.apk"
    group = "ba-protege"

    doLast {
        def originFile = file("${buildDir}/outputs/apk/release/app-release.apk")
        def targetDir = file("${projectDir}/../../landing/assets/apk")
        def targetFile = file("${targetDir}/ba-protege-release.apk")

        if (originFile.exists()) {
            targetDir.mkdirs()
            java.nio.file.Files.copy(
                originFile.toPath(),
                targetFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            def sizeMb = String.format(java.util.Locale.US, "%.2f", (double) originFile.length() / (1024 * 1024))
            println("🚀 [BA Protege+] APK RELEASE copiada exitosamente (${sizeMb} MB) a:")
            println("   ${targetFile.absolutePath}")
        } else {
            println("⚠️ [BA Protege+] APK release no encontrada en: ${originFile.absolutePath}")
        }
    }
}

// ==============================================================================
// Automatización: Sincronización de videos locales hacia res/raw
// ==============================================================================
tasks.register('syncSplashVideoAsset') {
    description = "Sincroniza apertura.mp4, hola_botito.mp4 y botito_bienvenida.mp4 hacia android/app/src/main/res/raw/"
    group = "ba-protege"

    doLast {
        def targetRawDir = file("${projectDir}/src/main/res/raw")
        targetRawDir.mkdirs()

        ['apertura.mp4', 'hola_botito.mp4', 'botito_bienvenida.mp4'].each { videoFileName ->
            def sourceVideo = file("${projectDir}/../../src/assets/videos/${videoFileName}")
            def targetVideo = file("${targetRawDir}/${videoFileName}")

            if (sourceVideo.exists()) {
                if (!targetVideo.exists() ||
                    sourceVideo.length() != targetVideo.length() ||
                    sourceVideo.lastModified() > targetVideo.lastModified()) {
                    java.nio.file.Files.copy(
                        sourceVideo.toPath(),
                        targetVideo.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                    )
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn('syncSplashVideoAsset')
}

tasks.configureEach { task ->
    if (task.name == "assembleRelease" || task.name == "packageRelease") {
        task.finalizedBy('copyReleaseApkToLanding')
    }
}

